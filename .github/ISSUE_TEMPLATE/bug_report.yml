name: Bug report / 问题反馈
description: 无声音、切歌停顿、跳歌、预载失败等（请务必附上指定信息）
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！这个插件的几乎所有问题都能从日志里看出来，
        **不填下面三项的话基本没法定位**，请务必填写。

  - type: input
    id: client-version
    attributes:
      label: 网易云音乐版本
      description: 客户端「设置 → 关于网易云音乐」里的完整版本号
      placeholder: 例如 3.1.42.205594
    validations:
      required: true

  - type: input
    id: betterncm-version
    attributes:
      label: BetterNCM 版本
      description: 插件管理器页面左上角显示的版本
      placeholder: 例如 1.3.4
    validations:
      required: true

  - type: dropdown
    id: play-mode
    attributes:
      label: 出问题时的播放模式
      description: 随机播放下无法提前知道下一首，无缝只在「预测命中」时才会启用
      options:
        - 顺序播放（playonce）
        - 列表循环（playorder）
        - 随机播放（playrandom）
        - 单曲循环 / 心动模式 / 其他
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: symptom
    attributes:
      label: 现象
      multiple: true
      options:
        - 切歌有停顿（没有无缝）
        - 播完跳歌 / 少播一首
        - 播完卡住、不自动下一首
        - 没有声音
        - 预载失败 / 音质只有 128k
        - 歌词不显示
        - 客户端崩溃或安装后没有出现插件
        - 其他
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 关键日志（必填）
      description: |
        打开 `C:\betterncm\gapless-player.log`（或你的 BETTERNCM_PROFILE 目录），
        贴出问题时间点前后约 50 行。**请把曲目 id、本机用户名/路径打码。**
        建议至少包含这几类行：`[preload]`、`[sched]`、`[end]`、`[call] ▶ player.setCurrentPlay`。
      render: text
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 例如「顺序播放某歌单 → 让它自然播完 → 观察是否停顿」
      placeholder: |
        1. 播放模式设为 ___
        2. 播放歌单 ___
        3. 等第 1 首自然播完
        4. 现象：___
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 其他补充
      description: 是否装过其他 BetterNCM 插件（尤其是接管播放/歌词的）、是否改过 `window.__gpStream` / `__gpNativeAll` 等开关
    validations:
      required: false
